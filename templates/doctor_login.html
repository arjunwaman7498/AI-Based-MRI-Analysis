{% load static %}
<!DOCTYPE html>
<html>

<head>

    <title>Doctor Login</title>

    <style>

        body{
            background-image:url("{% static 'images/background.png' %}");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            background-attachment:fixed;

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family:Arial,sans-serif;
        }

        .login-box{
            background:rgba(255,255,255,.9);

            padding:40px;

            border-radius:20px;

            text-align:center;
        }

        input{

            width:250px;

            padding:12px;

            margin:10px 0;
        }

        button{

            width:275px;

            padding:12px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>👨‍⚕️ Doctor Login</h1>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <br>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <br>

            <button type="submit">

                Login

            </button>

        </form>

    </div>

</body>

</html>
