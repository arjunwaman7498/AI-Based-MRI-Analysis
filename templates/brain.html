{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Brain Tumor Detection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body
style="
background-image:url('{% static 'images/background.png' %}');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
">

    <div class="container mt-5">

        <div class="card shadow-lg p-5">

            <h1 class="text-center mb-4">
                AI-Based MRI Analysis
            </h1>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="mb-3">
                    <input type="text"
                        class="form-control"
                        name="name"
                        placeholder="Patient Name"
                        required>
                </div>

                <div class="mb-3">
                    <input type="number"
                        class="form-control"
                        name="age"
                        placeholder="Age"
                        required>
                </div>

                <div class="mb-3">
                    <input type="text"
                        class="form-control"
                        name="contact"
                        placeholder="Contact Number"
                        required>
                </div>

                <div class="mb-3">
                    <input type="email"
                        class="form-control"
                        name="email"
                        placeholder="Email"
                        required>
                </div>

                <div class="mb-3">
                    <input type="text"
                        class="form-control"
                        name="username"
                        placeholder="Username"
                        required>
                </div>

                <div class="mb-4">
                    <input type="file"
                        class="form-control"
                        name="image"
                        required>
                </div>

                <button class="btn btn-primary w-100"
                    type="submit">

                    Analyze MRI

                </button>

            </form>

        </div>

    </div>

</body>

</html>
